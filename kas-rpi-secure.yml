# KAS configuration for building a secure Raspberry Pi image with Yocto Project
header:
  version: 11
machine: "raspberrypi5"
distro: rpi-secure
target:
  - rpi-secure-image-base
  - rpi-secure-image-demo
repos:
  # It's current revision will be used to perform the build.
  meta-raspberrypi-secure:
  poky:
    url: "https://git.yoctoproject.org/git/poky"
    branch: scarthgap
    path: "layers"
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:
  meta-raspberrypi:
    url: "https://git.yoctoproject.org/git/meta-raspberrypi.git"
    branch: scarthgap
    path: "layers/meta-raspberrypi"
  meta-openembedded:
    url: "https://github.com/openembedded/meta-openembedded.git"
    branch: scarthgap
    path: "layers/meta-openembedded"
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-perl:
      meta-python:
      meta-multimedia:
      meta-filesystems:
      meta-webserver:
  meta-security:
    url: https://git.yoctoproject.org/meta-security
    branch: scarthgap
    path: "layers/meta-security"
    layers:
      .:
      meta-integrity:
      meta-tpm:
  meta-selinux:
    url: "https://git.yoctoproject.org/git/meta-selinux.git"
    branch: scarthgap
    path: "layers/meta-selinux"
  meta-avb:
    url: "https://github.com/embetrix/meta-avb.git"
    branch: scarthgap
    path: "layers/meta-avb"
env:
  SECURITY_PROFILE: "dev"
local_conf_header:
  standard: |
    CONF_VERSION = "2"
    INHERIT += "rm_work"
  security: |
    RPI_SECURITY_PROFILE = "${SECURITY_PROFILE}"
