globals :
{
	verbose  = true;
	loglevel = 5;
	syslog   = true;
	/*public-key-file	= "foo.pem";*/
	/*aes-key-file		= "foo.key";*/
};

webserver :
{
	document_root	= "/www";
	userid		 	= 4001;
	groupid			= 4001;
};

suricatta :
{
	polldelay		= 20;
	nocheckcert		= false;
	/*sslcert			= "/etc/certs/rpi-device-cert.pem";*/
	/*sslkey			= "pkcs11:token=RPi%20OTP%20key;id=%01;type=private";*/
	retry			= 4;
	retrywait		= 200;
	loglevel		= 10;
	enable			= true;
	userid			= 4002;
	groupid			= 4002;
}

