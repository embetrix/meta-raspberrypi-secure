name: OELINT

on:
  push:
    branches: [ "wrynose" ]
  pull_request:
    branches: [ "wrynose" ]

jobs:
  oelint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install oelint-adv
        run: pip install oelint-adv

      - name: OE Recipe Lint
        run: |
          oelint-adv --exit-zero --rulefile .oelint-rulefile.json --release wrynose \
            $(find . -name '*.bb' -o -name '*.bbappend' -o -name '*.bbclass' -o -name '*.inc' | grep -v /layers/)
