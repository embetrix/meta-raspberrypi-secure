[Unit]
# Wait for clock synchronization before validating the MQTT server certificate
Requires=systemd-time-wait-sync.service
Wants=network-online.target time-sync.target
After=network-online.target time-sync.target systemd-time-wait-sync.service

[Service]
# Select the TLS compatibility profile for ThingsBoard MQTT
Environment=OPENSSL_CONF=/etc/ssl/openssl-thingsboard.cnf
