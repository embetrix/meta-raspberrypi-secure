[Unit]
Requires=systemd-tmpfiles-setup.service
After=local-fs.target systemd-tmpfiles-setup.service
RequiresMountsFor=/var/data /etc/thermopro-sensor/thermopro-sensor.json /var/lib/thermopro-sensor

[Service]
DynamicUser=no
User=thermopro-sensor
Group=thermopro-sensor
StateDirectory=

# Replace the quoted upstream credential source with the mounted config path
LoadCredential=
LoadCredential=thermopro-sensor.json:/etc/thermopro-sensor/thermopro-sensor.json
