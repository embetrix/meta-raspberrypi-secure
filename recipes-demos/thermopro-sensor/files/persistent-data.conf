[Unit]
Requires=systemd-tmpfiles-setup.service
After=local-fs.target systemd-tmpfiles-setup.service
RequiresMountsFor=/var/data /var/lib

[Service]
# DynamicUser=yes uses the existing account and keeps upstream sandboxing
User=thermopro-sensor
Group=thermopro-sensor
# tmpfiles creates the mount point and persistent state with stable ownership
StateDirectory=
BindReadOnlyPaths=/var/data/etc/thermopro-sensor/thermopro-sensor.json:/etc/thermopro-sensor/thermopro-sensor.json
BindPaths=/var/data/var/lib/thermopro-sensor:/var/lib/thermopro-sensor

# Load credentials from the host path outside the service bind mounts
LoadCredential=
LoadCredential=thermopro-sensor.json:/var/data/etc/thermopro-sensor/thermopro-sensor.json
