# Busybox security hardening fragment
# Only override security-relevant options everything else
# comes from the default defconfig.

# SUID privilege control
CONFIG_FEATURE_SUID=y
CONFIG_FEATURE_SUID_CONFIG=y
CONFIG_FEATURE_SUID_CONFIG_QUIET=y
CONFIG_FEATURE_INSTALLER=n

# Password authentication hardening
CONFIG_PASSWORD_MINLEN=8
CONFIG_FEATURE_SHADOWPASSWDS=n

# Disable su and login which are not needed in a secure system
CONFIG_SU=n
CONFIG_FEATURE_SU_SYSLOG=n
CONFIG_FEATURE_SU_CHECKS_SHELLS=n
CONFIG_FEATURE_SU_BLANK_PW_NEEDS_SECURE_TTY=n
CONFIG_LOGIN=n
CONFIG_LOGIN_SESSION_AS_CHILD=n
CONFIG_LOGIN_SCRIPTS=n
CONFIG_FEATURE_SECURETTY=n
CONFIG_SULOGIN=n
CONFIG_GETTY=n
CONFIG_ADDUSER=n
CONFIG_ADDGROUP=n
CONFIG_FEATURE_ADDUSER_TO_GROUP=n
CONFIG_DELUSER=n
CONFIG_DELGROUP=n
CONFIG_FEATURE_DEL_USER_FROM_GROUP=n

# Disable network daemons
CONFIG_HTTPD=n
CONFIG_FTPD=n
CONFIG_TELNETD=n
CONFIG_TFTPD=n
CONFIG_INETD=n
CONFIG_DNSD=n
CONFIG_NTPD=n
CONFIG_TCPSVD=n
CONFIG_UDPSVD=n
CONFIG_UDHCPD=n
CONFIG_DHCPRELAY=n
CONFIG_NC_SERVER=n

# Disable insecure cleartext clients
CONFIG_TELNET=n
CONFIG_FTPGET=n
CONFIG_FTPPUT=n

# Disable raw hardware memory access
CONFIG_DEVMEM=n
CONFIG_CONSPY=n
CONFIG_SETSERIAL=n

# Disable coredumps from init
CONFIG_FEATURE_INIT_COREDUMPS=n

# Disable debug profiling features
CONFIG_DEBUG=n
CONFIG_DEBUG_PESSIMIZE=n
CONFIG_DEBUG_SANITIZE=n
CONFIG_UNIT_TEST=n

# Kernel module taint checking
CONFIG_FEATURE_CHECK_TAINTED_MODULE=y

# Disable weak TLS ciphers
CONFIG_FEATURE_TLS_SHA1=n
