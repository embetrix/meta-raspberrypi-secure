[Upload]
# URL of the remote systemd-journal-remote endpoint
# URL=https://log-server.example.com:19532

# Client TLS certificate and key for mutual authentication
# ServerKeyFile=/etc/certs/journal-upload.pem
# ServerCertificateFile=/etc/certs/journal-upload.pem

# CA certificate to verify the remote server
# TrustedCertificateFile=/etc/certs/ca_trusted.pem

# Bearer token for HTTP authentication
# Header=Authorization: Bearer <your-secret-token>

# Enforce Compression
ForceCompression=true
Compression=zstd:4

NetworkTimeoutSec=20min
